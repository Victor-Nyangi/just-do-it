name = "just-do-it-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
# `nodejs_compat` is required by @clerk/backend, which reaches for a few node
# built-ins even on the edge build.
compatibility_flags = ["nodejs_compat"]

# `database_id` is filled in by `wrangler d1 create just-do-it` — see SETUP.md.
# The placeholder is deliberate: committing a real id is harmless (it is not a
# secret) but it would differ per person setting this up.
[[d1_databases]]
binding = "DB"
database_name = "just-do-it"
database_id = "126f330e-d988-4921-abeb-7a5d5566a73a"

[vars]
# Comma-separated. Vercel preview deployments get their own subdomain per
# branch, so the production origin alone is not enough if you want previews to
# talk to the API too.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"

# CLERK_SECRET_KEY is a secret and must NOT live here.
#   pnpm --filter @just-do-it/api exec wrangler secret put CLERK_SECRET_KEY

# Workers Logs. Without this you still get real-time logs (`wrangler tail`, or
# the dashboard's live view), but nothing is kept — so a request that failed
# while you were not watching is gone. `enabled` is the line doing the work;
# `persist` already defaults to true on new Workers.
#
# Sampling every request is right for a single-user tracker and would not be for
# anything with traffic.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# Tracing is off: it costs more to keep and there is no multi-service call graph
# here to untangle. Turn it on if the Worker ever fans out to other services.
[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
